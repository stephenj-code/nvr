mqtt:
  enabled: false

go2rtc:
  streams:
    front_door:
      - rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@192.168.1.45/cam/realmonitor?channel=1&subtype=0
    front_door_sub:
      - rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@192.168.1.45/cam/realmonitor?channel=1&subtype=1

detectors:
  default:
    type: tensorrt
    device: 0

model:
  path: /config/model/yolov8m.engine
  input_tensor: nchw
  input_pixel_format: rgb
  width: 640
  height: 640

database:
  path: /data/frigate.db

ffmpeg:
  hwaccel_args: preset-jetson-h264

record:
  enabled: true
  alerts:
    retain:
      days: 14
  detections:
    retain:
      days: 14
  continuous:
    days: 7
  motion:
    days: 7

snapshots:
  enabled: true
  retain:
    default: 14

objects:
  track:
    - person
    - car
    - motorcycle
    - bus
    - truck
    - cat
    - dog
    - bird
  filters:
    cat:
      min_score: 0.5
      threshold: 0.7
    dog:
      min_score: 0.5
      threshold: 0.7
    bird:
      min_score: 0.5
      threshold: 0.7
      min_area: 1500  # ignore tiny/distant birds

cameras:
  front_door:
    live:
      streams:
        front_door: front_door
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/front_door
          input_args: preset-rtsp-restream
          roles:
            - record
        - path: rtsp://127.0.0.1:8554/front_door_sub
          input_args: preset-rtsp-restream
          roles:
            - detect
    detect:
      enabled: true
      width: 704
      height: 480
      fps: 5
    motion:
      mask:
        - 0,0,704,50

classification:
  custom:
    Hunter:
      enabled: true
      name: Hunter
      threshold: 0.8
      object_config:
        objects:
          - person
        classification_type: sub_label
    Dalen:
      enabled: true
      name: Dalen
      threshold: 0.8
      object_config:
        objects:
          - person
        classification_type: sub_label
    Kutti-kitty:
      enabled: true
      name: Kutti-kitty
      threshold: 0.8
      object_config:
        objects:
          - person
        classification_type: sub_label
    Stephen:
      enabled: true
      name: Stephen
      threshold: 0.8
      object_config:
        objects:
          - person
        classification_type: sub_label
