<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NVR Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f1419; color: #e7e9ea; }
        .header { padding: 1rem 2rem; border-bottom: 1px solid #2f3336; display: flex; align-items: center; justify-content: space-between; }
        .header h1 { font-size: 1.4rem; font-weight: 600; }
        .header a { color: #1d9bf0; text-decoration: none; font-size: 0.9rem; }
        .container { max-width: 1400px; margin: 0 auto; padding: 2rem; }
        .grid { display: grid; grid-template-columns: 2fr 1fr; gap: 2rem; }
        .feed-section { background: #16181c; border-radius: 12px; overflow: hidden; }
        .feed-header { padding: 1rem 1.5rem; border-bottom: 1px solid #2f3336; font-weight: 600; }
        .feed-container { position: relative; width: 100%; padding-top: 56.25%; background: #000; }
        .feed-container img, .feed-container video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; }
        .feed-toggle { display: flex; gap: 0.5rem; }
        .feed-toggle button { background: #1c1f23; color: #e7e9ea; border: 1px solid #2f3336; border-radius: 4px; padding: 0.3rem 0.6rem; font-size: 0.75rem; cursor: pointer; }
        .feed-toggle button.active { background: #1d9bf0; border-color: #1d9bf0; }
        .events-section { background: #16181c; border-radius: 12px; max-height: 600px; overflow-y: auto; }
        .events-header { padding: 1rem 1.5rem; border-bottom: 1px solid #2f3336; font-weight: 600; position: sticky; top: 0; background: #16181c; z-index: 1; }
        .event-item { padding: 0.75rem 1.5rem; border-bottom: 1px solid #2f3336; display: flex; justify-content: space-between; align-items: center; }
        .event-item:hover { background: #1c1f23; }
        .event-label { font-weight: 500; text-transform: capitalize; }
        .event-time { color: #71767b; font-size: 0.85rem; }
        .event-camera { color: #1d9bf0; font-size: 0.85rem; }
        .stats-bar { display: flex; gap: 2rem; padding: 1rem 2rem; background: #16181c; border-radius: 12px; margin-bottom: 2rem; }
        .stat { text-align: center; }
        .stat-value { font-size: 1.5rem; font-weight: 700; color: #1d9bf0; }
        .stat-label { font-size: 0.8rem; color: #71767b; margin-top: 0.25rem; }
        .no-events { padding: 2rem; text-align: center; color: #71767b; }
        @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="header">
        <h1>NVR Dashboard</h1>
        <div style="display:flex;align-items:center;gap:1.5rem">
            <a href="/frigate/" target="_blank">Frigate UI</a>
            <span id="user-info" style="display:none;font-size:0.9rem;color:#71767b">
                <span id="user-name"></span>
                <a href="/auth/logout" style="color:#71767b;margin-left:0.75rem" title="Sign out">&#x23FB;</a>
            </span>
        </div>
    </div>
    <div class="container">
        <div class="stats-bar" id="stats-bar">
            <div class="stat"><div class="stat-value" id="stat-uptime">--</div><div class="stat-label">Uptime</div></div>
            <div class="stat"><div class="stat-value" id="stat-fps">--</div><div class="stat-label">Detection FPS</div></div>
            <div class="stat"><div class="stat-value" id="stat-inference">--</div><div class="stat-label">Inference ms</div></div>
            <div class="stat"><div class="stat-value" id="stat-events">--</div><div class="stat-label">Events Today</div></div>
        </div>
        <div class="grid">
            <div class="feed-section">
                <div class="feed-header" style="display:flex;justify-content:space-between;align-items:center">
                    <span>Front Door - Live</span>
                    <div class="feed-toggle">
                        <button id="btn-live" class="active" onclick="switchFeed('live')">HD Live</button>
                        <button id="btn-detect" onclick="switchFeed('detect')">Detect</button>
                    </div>
                </div>
                <div class="feed-container">
                    <video id="live-video" autoplay muted playsinline controls style="display:none"></video>
                    <img id="live-feed" alt="Live Feed">
                </div>
            </div>
            <div class="events-section">
                <div class="events-header">Recent Events</div>
                <div id="events-list"><div class="no-events">Loading...</div></div>
            </div>
        </div>
    </div>
    <script>
        const feedImg = document.getElementById('live-feed');
        const feedVideo = document.getElementById('live-video');
        let detectInterval = null;
        let mseWs = null;
        let mseSource = null;
        let mseBuffer = null;
        let mseQueue = [];
        let mseAppending = false;

        function stopMSE() {
            if (mseWs) { try { mseWs.close(); } catch(e) {} mseWs = null; }
            mseBuffer = null;
            mseQueue = [];
            mseAppending = false;
            if (mseSource && mseSource.readyState === 'open') {
                try { mseSource.endOfStream(); } catch(e) {}
            }
            mseSource = null;
            feedVideo.src = '';
        }

        function startMSE() {
            if (!window.MediaSource) { switchFeed('detect'); return; }
            stopMSE();

            mseSource = new MediaSource();
            feedVideo.src = URL.createObjectURL(mseSource);

            // Step 1: wait for MediaSource to open
            mseSource.addEventListener('sourceopen', () => {
                // Step 2: open WebSocket and immediately send codec request on open
                const proto = location.protocol === 'https:' ? 'wss' : 'ws';
                mseWs = new WebSocket(`${proto}://${location.host}/ws/go2rtc?src=front-west`);
                mseWs.binaryType = 'arraybuffer';

                mseWs.onopen = () => {
                    // Step 3: initiate go2rtc MSE stream
                    mseWs.send(JSON.stringify({ type: 'mse', value: ['video/mp4'] }));
                };

                mseWs.onmessage = (ev) => {
                    if (typeof ev.data === 'string') {
                        // Step 4: go2rtc replies with codec string — create SourceBuffer
                        const msg = JSON.parse(ev.data);
                        if (msg.type === 'mse' && !mseBuffer) {
                            try {
                                mseBuffer = mseSource.addSourceBuffer(msg.value);
                                mseBuffer.mode = 'segments';
                                mseBuffer.addEventListener('updateend', () => {
                                    mseAppending = false;
                                    drainQueue();
                                    // Resume play if it was deferred or interrupted
                                    if (feedVideo.paused) feedVideo.play().catch(() => {});
                                });
                            } catch(e) {
                                console.error('MSE addSourceBuffer failed:', msg.value, e);
                                stopMSE();
                                switchFeed('detect');
                            }
                        }
                    } else {
                        // Step 5: binary MP4 fragments — queue and append
                        mseQueue.push(ev.data);
                        if (mseQueue.length > 50) mseQueue.shift();
                        drainQueue();
                        // Start playing on first data if still paused
                        if (mseBuffer && feedVideo.paused) feedVideo.play().catch(() => {});
                    }
                };

                mseWs.onclose = () => { setTimeout(startMSE, 2000); };
                mseWs.onerror = (e) => { console.error('MSE WS error', e); stopMSE(); switchFeed('detect'); };
            }, { once: true });
        }

        function drainQueue() {
            if (!mseBuffer || mseAppending || mseBuffer.updating || mseQueue.length === 0) return;
            mseAppending = true;
            try { mseBuffer.appendBuffer(mseQueue.shift()); }
            catch(e) { mseAppending = false; }
        }

        function switchFeed(mode) {
            document.getElementById('btn-live').classList.toggle('active', mode === 'live');
            document.getElementById('btn-detect').classList.toggle('active', mode === 'detect');

            if (detectInterval) { clearInterval(detectInterval); detectInterval = null; }

            if (mode === 'live') {
                feedImg.style.display = 'none';
                feedVideo.style.display = '';
                startMSE();
            } else {
                stopMSE();
                feedVideo.style.display = 'none';
                feedImg.style.display = '';
                feedImg.src = '/stream/front-west?' + Date.now();
                detectInterval = setInterval(() => {
                    feedImg.src = '/stream/front-west?' + Date.now();
                }, 1000);
            }
        }

        async function loadEvents() {
            try {
                const resp = await fetch('/api/events?limit=20');
                if (!resp.ok) throw new Error(resp.status);
                const events = await resp.json();
                const list = document.getElementById('events-list');
                document.getElementById('stat-events').textContent = events.length;
                if (!events.length) { list.innerHTML = '<div class="no-events">No events yet</div>'; return; }
                list.innerHTML = events.map(e => `
                    <div class="event-item">
                        <div>
                            <div class="event-label">${e.label} (${(e.data?.top_score * 100 || 0).toFixed(0)}%)</div>
                            <div class="event-camera">${e.camera}</div>
                        </div>
                        <div class="event-time">${new Date(e.start_time * 1000).toLocaleTimeString()}</div>
                    </div>
                `).join('');
            } catch (err) {
                console.error('loadEvents:', err);
                document.getElementById('events-list').innerHTML = '<div class="no-events">Frigate unavailable</div>';
            }
        }

        async function loadStats() {
            try {
                const resp = await fetch('/api/stats');
                if (!resp.ok) throw new Error(resp.status);
                const stats = await resp.json();
                const cam = stats.cameras?.front_door;
                if (cam) {
                    document.getElementById('stat-fps').textContent = cam.detection_fps?.toFixed(1) || '--';
                }
                const det = stats.detectors?.default;
                if (det) {
                    document.getElementById('stat-inference').textContent = det.inference_speed?.toFixed(1) || '--';
                }
                if (stats.service?.uptime) {
                    const hrs = Math.floor(stats.service.uptime / 3600);
                    const min = Math.floor((stats.service.uptime % 3600) / 60);
                    document.getElementById('stat-uptime').textContent = hrs > 0 ? hrs + 'h' : min + 'm';
                }
            } catch (err) { console.error('loadStats:', err); }
        }

        async function loadUser() {
            try {
                const resp = await fetch('/auth/me');
                const data = await resp.json();
                if (data.authenticated) {
                    document.getElementById('user-name').textContent = data.user.name || data.user.email;
                    document.getElementById('user-info').style.display = 'inline';
                }
            } catch (err) {}
        }

        // Start with HD live feed
        loadUser();
        loadEvents();
        loadStats();
        switchFeed('live');
        setInterval(loadEvents, 10000);
        setInterval(loadStats, 5000);
    </script>
</body>
</html>
