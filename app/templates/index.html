<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NVR</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #0f0f0f; color: #e0e0e0; font-family: system-ui, sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        .header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 8px 16px; background: #1a1a1a; border-bottom: 1px solid #2a2a2a;
            flex-shrink: 0;
        }
        .header h1 { font-size: 16px; font-weight: 700; letter-spacing: 3px; color: #fff; }
        .stats-bar { display: flex; gap: 18px; font-size: 12px; color: #666; }
        .stat-val { color: #ccc; font-weight: 500; }
        .user-info { font-size: 12px; color: #555; }
        .user-info a { color: #444; text-decoration: none; margin-left: 8px; }
        .user-info a:hover { color: #888; }

        .cameras {
            display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
            padding: 6px; flex: 1; min-height: 0;
        }
        .camera-panel {
            position: relative; background: #000; border-radius: 4px;
            overflow: hidden; display: flex; align-items: center; justify-content: center;
        }
        .camera-label {
            position: absolute; top: 8px; left: 8px;
            background: rgba(0,0,0,0.65); color: #ddd; font-size: 11px;
            padding: 2px 8px; border-radius: 3px; z-index: 2; letter-spacing: 0.5px;
        }
        .camera-feed { width: 100%; height: 100%; object-fit: contain; display: block; }
        .camera-error {
            color: #444; font-size: 13px; text-align: center; padding: 20px;
            display: none; position: absolute;
        }

        .events-section {
            background: #161616; border-top: 1px solid #242424;
            padding: 6px 14px 8px; max-height: 160px; overflow-y: auto; flex-shrink: 0;
        }
        .events-header {
            font-size: 10px; font-weight: 600; color: #555;
            text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 5px;
        }
        .events-list { display: flex; flex-wrap: wrap; gap: 5px; }
        .event-item {
            background: #202020; border-radius: 3px; padding: 3px 10px;
            font-size: 11px; display: flex; align-items: center; gap: 7px;
        }
        .ev-label { color: #ddd; font-weight: 500; }
        .ev-score { color: #5a9; }
        .ev-cam { color: #555; }
        .ev-time { color: #444; }
        .no-events { color: #444; font-size: 12px; }

        @media (max-width: 640px) {
            .cameras { grid-template-columns: 1fr; }
            .stats-bar { display: none; }
        }
    </style>
</head>
<body>

<div class="header">
    <h1>NVR</h1>
    <div class="stats-bar">
        <span>W: <span class="stat-val" id="fps-west">--</span> fps</span>
        <span>E: <span class="stat-val" id="fps-east">--</span> fps</span>
        <span>up <span class="stat-val" id="uptime">--</span></span>
        <span><span class="stat-val" id="ev-count">0</span> events</span>
    </div>
    <div class="user-info" id="user-info" style="display:none">
        <span id="user-name"></span><a href="/auth/logout">sign out</a>
    </div>
</div>

<div class="cameras">
    <div class="camera-panel">
        <span class="camera-label">Front West</span>
        <img id="cam-west" class="camera-feed"
             src="/live-mjpeg/front-west" alt="Front West"
             onerror="handleStreamError('cam-west', 'front-west')" />
        <div id="err-west" class="camera-error">Stream unavailable</div>
    </div>
    <div class="camera-panel">
        <span class="camera-label">Front East</span>
        <img id="cam-east" class="camera-feed"
             src="/live-mjpeg/front-east" alt="Front East"
             onerror="handleStreamError('cam-east', 'front-east')" />
        <div id="err-east" class="camera-error">Stream unavailable</div>
    </div>
</div>

<div class="events-section">
    <div class="events-header">Recent Detections</div>
    <div class="events-list" id="events-list">
        <span class="no-events">Loading&hellip;</span>
    </div>
</div>

<script>
    const streamErrors = {};

    function handleStreamError(imgId, streamName) {
        const img = document.getElementById(imgId);
        const errId = imgId.replace('cam-', 'err-');
        const errEl = document.getElementById(errId);
        img.style.display = 'none';
        errEl.style.display = 'block';
        // Retry after 5s
        if (!streamErrors[imgId]) {
            streamErrors[imgId] = setInterval(() => {
                img.src = '/live-mjpeg/' + streamName + '?t=' + Date.now();
                img.style.display = '';
                errEl.style.display = 'none';
            }, 5000);
        }
    }

    async function loadEvents() {
        try {
            const resp = await fetch('/api/events?limit=30');
            if (!resp.ok) throw new Error(resp.status);
            const events = await resp.json();
            document.getElementById('ev-count').textContent = events.length;
            const list = document.getElementById('events-list');
            if (!events.length) {
                list.innerHTML = '<span class="no-events">No detections yet</span>';
                return;
            }
            list.innerHTML = events.map(e => `
                <div class="event-item">
                    <span class="ev-label">${e.label}</span>
                    <span class="ev-score">${((e.data?.top_score || 0) * 100).toFixed(0)}%</span>
                    <span class="ev-cam">${e.camera}</span>
                    <span class="ev-time">${new Date(e.start_time * 1000).toLocaleTimeString()}</span>
                </div>`).join('');
        } catch (err) {
            document.getElementById('events-list').innerHTML = '<span class="no-events">Frigate unavailable</span>';
        }
    }

    async function loadStats() {
        try {
            const resp = await fetch('/api/stats');
            if (!resp.ok) return;
            const s = await resp.json();
            const w = s.cameras?.['front-west'];
            const e = s.cameras?.['front-east'];
            if (w) document.getElementById('fps-west').textContent = (w.detection_fps ?? '--');
            if (e) document.getElementById('fps-east').textContent = (e.detection_fps ?? '--');
            if (s.service?.uptime) {
                const h = Math.floor(s.service.uptime / 3600);
                const m = Math.floor((s.service.uptime % 3600) / 60);
                document.getElementById('uptime').textContent = h > 0 ? h + 'h' : m + 'm';
            }
        } catch (_) {}
    }

    async function loadUser() {
        try {
            const resp = await fetch('/auth/me');
            const d = await resp.json();
            if (d.authenticated) {
                document.getElementById('user-name').textContent = d.user.name || d.user.email;
                document.getElementById('user-info').style.display = 'inline';
            }
        } catch (_) {}
    }

    loadUser();
    loadEvents();
    loadStats();
    setInterval(loadEvents, 10000);
    setInterval(loadStats, 5000);
</script>
</body>
</html>
